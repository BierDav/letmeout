# What letmeout's functions do in HTML, for the doc comments that
# scripts/api-docs.py writes from Typst's documentation.
#
#   file       the source file with the definition
#   typst      the Typst docs page, below https://typst.app/docs/reference/
#   summary    replaces Typst's summary (optional)
#   html       how the function behaves in HTML, after the summary
#   signature  generate a signature with the parameters, passed as one
#              dictionary to this function (optional)
#   positional parameters the generated signature passes on through an
#              argument sink, such as a body (optional)
#   exclude    Typst parameters the function does not take, with the reason
#   returns    the return type (default: content)
#   params     how each parameter behaves in HTML. Every parameter that is not
#              excluded needs one. Each one says it applies to HTML rendering.

[grid]
file = "src/grid.typ"
typst = "layout/grid"
html = """A CSS Grid. Paged output is Typst's native grid, unchanged. Use \
`std.grid` for set and show rules, and `letmeout-extras.grid-cell`, `letmeout-extras.grid-hline`, `letmeout-extras.grid-vline`, \
`letmeout-extras.grid-header`, and `letmeout-extras.grid-footer` for its elements."""

[grid.params]
columns = """In HTML, CSS column tracks. `auto` sizes to the content, fractions share the \
free width as `minmax(0, Nfr)`, and lengths and percentages keep their units. \
A count creates that many automatic columns; an empty array gives one automatic column."""
rows = """In HTML, CSS row tracks, with the same sizing modes as columns. The last \
definition repeats for additional rows; an empty array gives automatic rows. \
Explicit rows and otherwise empty slots still receive cells and styling. \
Percentage row heights follow browser block-size resolution, not a PDF page height."""
gutter = """In HTML, CSS gaps. Varying, `auto`, or fractional gutters become tracks \
between the content tracks. The last entry repeats; an empty array means zero. \
Axis-specific gutter settings take precedence."""
column-gutter = "In HTML, like `gutter`, between columns. Takes precedence over `gutter`."
row-gutter = "In HTML, like `gutter`, between rows. Takes precedence over `gutter`."
inset = """In HTML, cell padding: one length for all sides, or a dictionary with \
`top`, `right`, `bottom`, `left`, `x`, `y`, and `rest`. Explicit sides override \
axis shorthands, which override `rest`; missing grid sides use zero. Arrays \
cycle by column and functions receive zero-based `(x, y)`, including empty cells. \
An empty array uses zero padding. Cell inset overrides named sides."""
align = """In HTML, text alignment and CSS alignment inside each cell, on both axes. \
`left`/`right` are physical; `start`/`end` follow text direction. \
`top`/`horizon`/`bottom` use available row height. Arrays cycle by column and \
functions receive zero-based `(x, y)`, including empty cells. An empty array \
adds no alignment; a cell override replaces only its specified axes."""
fill = """In HTML, CSS backgrounds. Colours and linear, conic, and radial gradients work; \
tilings, off-center radial focal circles, and parent-relative gradients fail \
with an error. `none` is transparent. Arrays cycle by column and functions \
receive zero-based `(x, y)`, including empty cells. An empty array is transparent. \
Cell `auto` inherits the grid fill; cell `none` removes it. Colors follow the \
document's color scheme."""
stroke = """In HTML, vector edges painted by CSS, with thickness, caps, dashes, and \
gradients. Accepts `paint`, `thickness`, `cap`, `join`, `dash` (including \
`array`/`phase`), and `miter-limit`, or side dictionaries using \
`top`/`right`/`bottom`/`left`, `x`/`y`/`rest`. Arrays cycle by column and functions \
receive zero-based `(x, y)`, including empty cells; an empty array adds no edges. \
Explicit separators override cell strokes, which override grid strokes; \
explicit `none` erases an edge. Later separators win; equal-priority cell \
edges use the thicker stroke. See docs/html-semantics.md for every stroke field."""
children = """In HTML, cells in row-major order. The page source follows the visual \
order, so screen readers read cells as they appear. Headers and footers render \
once: a screen has no page boundaries to repeat them at. Cell `x`/`y`, \
`colspan`/`rowspan`, `fill`/`inset`/`align`/`stroke`, and `breakable`, separator \
`x`/`y`/`start`/`end`/`position`/`stroke`, and header/footer `repeat`/`level` \
are documented individually in docs/html-semantics.md. Nested supported \
layouts remain selectable HTML."""

[line]
file = "src/line.typ"
typst = "visualize/line"
html = """An SVG stroke mask painted by CSS, hidden from screen readers. Paged \
output is Typst's native line, unchanged. Use `std.line` for set and show rules."""

[line.params]
start = """In HTML, physical `(x, y)` offset from the container's top-left, independent \
of text direction. Percentages on both axes use its inline width; absolute, \
font-relative, and mixed lengths retain their components. Positive vertical \
extent reserves flow height; negative coordinates can overflow."""
end = """In HTML, explicit physical `(x, y)` endpoint, with the same units and width-based \
percentages as `start`. When given, overrides both `length` and `angle`. \
With `none`, the endpoint is computed from `start`, `length`, and `angle`."""
length = """In HTML, distance from `start` when `end` is `none`. Percentages use the \
container's inline width; absolute, font-relative, and mixed lengths stay \
responsive. Ignored when `end` is given."""
angle = """In HTML, clockwise direction: `0deg` points right and `90deg` points down. \
The computed endpoint determines CSS rotation; vertical and reversed lines \
work. Ignored when `end` is given."""
stroke = """In HTML, CSS paint through an SVG mask. `paint` accepts colors and supported \
gradients; `thickness` sets the stroke width; `cap` maps to butt/round/square \
SVG caps; `dash` accepts named patterns or an array/dictionary with `array` \
and `phase` (`dot` uses the thickness). `join` and `miter-limit` are emitted \
but have no visible effect on a straight segment. Automatic fields use native \
defaults. Unsupported paints fail explicitly. Colors follow the document's \
color scheme. See docs/html-semantics.md for the shared stroke-field reference."""

[align]
file = "src/align.typ"
typst = "layout/align"
html = """A block that aligns its content with CSS. Paged output is Typst's \
native alignment, unchanged. Use `std.align` for set and show rules."""

[align.params]
alignment = """In HTML, `left`, `center`, and `right` stay on that side; `start` and \
`end` follow the text direction. `top`, `horizon`, and `bottom` need free \
space from a container, such as a grid row: HTML has no page height to align \
in. Horizontal alignment sets `text-align` and `justify-items`; vertical \
alignment sets `align-content`. Combined axes apply together; an omitted axis \
inherits the surrounding native alignment."""
body = """In HTML, selectable content inside a block container. Links and nested \
supported layouts keep their behavior. Nested alignment can position a group \
while aligning the text inside it differently. No viewport height is added."""

[page]
file = "src/page-api.typ"
typst = "layout/page"
signature = "native-page"
positional = ["body"]
html = """In HTML, it passes on exactly the \
arguments you give, so it behaves like `page` in every output: `letmeout-extras.page(...)[...]` \
and `show: letmeout-extras.page.with(...)` work as with `page`. Use `set page(...)` for set \
rules; the package does not shadow `page`. With `#show: letmeout`, HTML export turns \
page settings into one continuous block per run of equal settings, not a sheet of \
paper. Without it, Typst ignores page settings in HTML. Paged output is unchanged."""

[page.params]
paper = """In HTML, sets the width and height. The width caps the sheet; the height only \
resolves vertical percentage margins. Explicit dimensions override it."""
width = """In HTML, maximum width of the centred sheet. On narrower screens the sheet fills \
the available width. `auto` removes the cap."""
height = """In HTML, does not limit the block's height; the content does. Still resolves \
vertical percentage and automatic margins, and becomes the width when `flipped`."""
flipped = "In HTML, swaps width and height, so it changes the sheet width."
margin = """In HTML, padding on the sheet, with Typst's defaults, folding, `x`/`y`/`rest`, and \
ratios. With a fixed width, margins are fractions of the sheet width, so they shrink \
on narrower screens."""
bleed = "In HTML, no effect on screen; there is no trim box."
binding = """In HTML, the first page's layout applies, as HTML has no facing pages: an \
`inside` margin goes left for `left` and right for `right`."""
columns = """In HTML, CSS columns with the `columns.gutter` gap. Columns are at least `12em` \
wide, so they collapse on narrow screens."""
fill = """In HTML, background of the full-width block, following the color scheme. `auto` is \
transparent, so host colors and dark mode stay."""
numbering = """In HTML, shown in the automatic header or footer through `counter(page)`. HTML \
is one page, so the number does not advance at page breaks."""
supplement = "In HTML, no effect on screen."
number-align = """In HTML, the horizontal part aligns the automatic number; `top` puts it in the \
header, anything else in the footer."""
header = """In HTML, a `<header>` before the content, once per block, at the bottom of the top \
margin. `auto` shows the page number if `number-align` is at the top."""
header-ascent = "In HTML, space below the header content, relative to the top margin."
footer = """In HTML, a `<footer>` after the content, once per block, at the top of the bottom \
margin. `auto` shows the page number unless `number-align` is at the top."""
footer-descent = "In HTML, space above the footer content, relative to the bottom margin."
background = """In HTML, a layer behind the content, centred and clipped to the sheet. Hidden \
from screen readers and clicks."""
foreground = """In HTML, a layer above the content, like `background`. Hidden from screen \
readers and clicks."""
body = """In HTML, its own block with its own settings, inheriting the surrounding ones. \
Content before and after it forms separate blocks."""

