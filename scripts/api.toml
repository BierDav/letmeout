file = "src/element-api.typ"
typst = "layout/pagebreak"
alias = true
html = """In HTML, with `#show: letmeout`, a pagebreak adds nothing on screen. A strong break renders an \
empty, hidden `div` with `break-before`, so a printer breaks there. Paged output is unchanged."""

[pagebreak.params]
weak = "In HTML, a weak break renders nothing, since a block already starts on a new printed sheet."
to = """In HTML, `"odd"` and `"even"` become `break-before: recto` and `verso`; any other value becomes \
`break-before: page`."""

# Grid sub-elements. Their docs are on the grid page, under each element's own section.

[grid-cell]
file = "letmeout-extras.typ"
typst = "layout/grid"
anchor = "definitions-cell"
alias = true
html = """In HTML, the body sits in the cell's inner block, and `colspan`, `rowspan`, `inset`, `align`, \
`fill`, `stroke`, and `breakable` become CSS. See docs/html-semantics.md for every field. Paged \
output is unchanged."""

[grid-cell.params]
body = "In HTML, selectable content in the cell's inner block; nested supported layouts remain HTML."
x = "In HTML, the logical column, counted from the start side of the text direction. `auto` searches for a free column."
y = "In HTML, the row. `auto` searches for a free row."
colspan = "In HTML, the number of columns spanned, including gutter tracks in the CSS span."
rowspan = "In HTML, the number of rows spanned, including gutter tracks. Creates extra rows when needed."
inset = "In HTML, CSS padding. `auto` inherits the grid inset; `0pt` removes padding."
align = "In HTML, the cell's alignment. `auto` inherits the grid's value."
fill = "In HTML, the CSS background. `auto` inherits the grid fill, and `none` removes it."
stroke = "In HTML, the cell's edge strokes. `auto` inherits the grid strokes, and `none` erases all cell edges."
breakable = "In HTML, `true` emits `break-inside: auto` and `false` emits `break-inside: avoid`. A browser hint with no effect on the continuous screen flow."

[grid-hline]
file = "letmeout-extras.typ"
typst = "layout/grid"
anchor = "definitions-hline"
alias = true
html = """In HTML, a decorative stroke along the row edge, drawn over the cell edges in its range. \
See docs/html-semantics.md for every field. Paged output is unchanged."""

[grid-hline.params]
y = "In HTML, the row edge the line is drawn on. `auto` follows the last automatically placed cell."
start = "In HTML, the first column of the stroke."
end = "In HTML, the column the stroke stops before. `none` extends it to the last column."
stroke = "In HTML, a decorative stroke over the cell edges in its range. `none` erases those edges."
position = "In HTML, `top` and `bottom` select different edges when there is a gutter."

[grid-vline]
file = "letmeout-extras.typ"
typst = "layout/grid"
anchor = "definitions-vline"
alias = true
html = """In HTML, a decorative stroke along the column edge, drawn over the cell edges in its range. \
See docs/html-semantics.md for every field. Paged output is unchanged."""

[grid-vline.params]
x = "In HTML, the column edge the line is drawn on. `auto` follows the last automatically placed cell."
start = "In HTML, the first row of the stroke."
end = "In HTML, the row the stroke stops before. `none` extends it to the last row."
stroke = "In HTML, a decorative stroke over the cell edges in its range. `none` erases those edges."
position = "In HTML, `start` and `end` follow text direction, while `left` and `right` stay physical."

[grid-header]
file = "letmeout-extras.typ"
typst = "layout/grid"
anchor = "definitions-header"
alias = true
html = """In HTML, its cells are flattened into the grid and marked as a header group. It renders once, since \
a screen has no page boundaries to repeat it at. See docs/html-semantics.md for every field. Paged \
output is unchanged."""

[grid-header.params]
children = """In HTML, the cells are flattened into the grid with `data-grid-group="header"`."""
repeat = "In HTML, recorded as `data-grid-repeat`. The content renders once, since a screen has no page boundaries."
level = "In HTML, recorded as `data-grid-level`. No hierarchy is added without page boundaries."

[grid-footer]
file = "letmeout-extras.typ"
typst = "layout/grid"
anchor = "definitions-footer"
alias = true
html = """In HTML, its cells are flattened into the grid and marked as a footer group. It renders once, since \
a screen has no page boundaries to repeat it at. See docs/html-semantics.md for every field. Paged \
output is unchanged."""

[grid-footer.params]
children = """In HTML, the cells are flattened into the grid with `data-grid-group="footer"`."""
repeat = "In HTML, recorded as `data-grid-repeat`. The content renders once, since a screen has no page boundaries."
