html = """In HTML, the image sits in a `letmeout-image` element with `data-size` set from \
`width` and `height`, and `data-fit` when both are set, so the stylesheet sizes it. \
Paged output is unchanged."""

[image.params]
source = "In HTML, unchanged: Typst's native image output."
format = "In HTML, unchanged: Typst's native image output."
width = "In HTML, sets `data-size` (`width`, `height`, `both`, or `auto`) on the wrapper, which the stylesheet uses for sizing."
height = "In HTML, sets `data-size` (`width`, `height`, `both`, or `auto`) on the wrapper, which the stylesheet uses for sizing."
alt = "In HTML, unchanged: Typst's native image output."
page = "In HTML, unchanged: Typst's native image output."
fit = "In HTML, sets `data-fit` when both `width` and `height` are set, so the stylesheet fits the image to them."
